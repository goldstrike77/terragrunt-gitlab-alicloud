include:
  - template: Terraform/Base.latest.gitlab-ci.yml
  - template: Jobs/SAST-IaC.latest.gitlab-ci.yml

stages:
  - init
  - validate
  - test
  - build
  - deploy
  - cleanup

variables:
  IGNORE_TF_DEPRECATION_WARNING: "true"
  SECURE_ANALYZERS_PREFIX: "ccr.ccs.tencentyun.com/gitlab-org"
  TF_STATE_BASE_ADDRESS: $CI_API_V4_URL/projects/$CI_PROJECT_ID/terraform/state
  TF_CLI_ARGS_apply: "-parallelism=1"

default:
  image:
    name: "registry.cn-hangzhou.aliyuncs.com/goldenimage/terragrunt:1.13.5-v0.93.3"
  
  cache:
    key: $CI_COMMIT_REF_SLUG
    paths:
      - ${TF_ROOT}/**/.terragrunt-cache
    policy: pull

.source:
  script:
    - source $(which gitlab-terraform)

before_script:
  - cp /etc/gitlab-runner/certs/gitlab.home.local.crt /usr/local/share/ca-certificates/ca.crt
  - update-ca-certificates
  - |-
    cat <<EOF > ~/.terraformrc
    provider_installation {
      network_mirror {
        url = "https://obs.home.local/mirror/"
      }
    }
    EOF

init:
  stage: init
  cache:
    key: $CI_COMMIT_REF_SLUG
    paths:
      - ${TF_ROOT}/**/.terragrunt-cache
    policy: pull-push
  script:
    - !reference [.source, script]
    - terragrunt init --all -input=false -reconfigure --non-interactive -lock=false

fmt:
  extends: .terraform:fmt
  script:
    - !reference [.source, script]
    - terragrunt hcl format --check --all --diff

validate:
  extends: .terraform:validate
  script:
    - !reference [.source, script]
    - terragrunt validate --all

build:
  extends: .terraform:build
  script:
    - !reference [.source, script]
    - terragrunt plan --all --non-interactive --source-update
  artifacts:
    paths:
      - ${TF_ROOT}/**/.terragrunt-cache
    reports:
      terraform: ${TF_ROOT}/plan.json

deploy:
  extends: .terraform:deploy
  dependencies: [build]
  script:
    - !reference [.source, script]
    - terragrunt apply --all --non-interactive
  rules:
    - if: $CI_COMMIT_TITLE == "deploy"
      when: on_success
  environment:
    name: $TF_STATE_NAME

destroy:
  extends: .terraform:destroy
  dependencies: [build]
  script:
    - !reference [.source, script]
    - terragrunt destroy --all --non-interactive -input=false
  rules:
    - if: $CI_COMMIT_TITLE == "destroy"
      when: on_success
  environment:
    name: $TF_STATE_NAME